name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt (PySide6) for the Windows UI tests
        run: |
          python -m pip install --upgrade pip
          pip install PySide6

      - name: Run test suite (data layer + headless Qt UI)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
